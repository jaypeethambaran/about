<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Budget Explorer</title>
<meta name="description" content="Explore an IT budget for licences, services and hardware from any CSV, with invoice-based pages for key contracts. Runs entirely in the browser.">
<style>
/* =====================================================================
   Design tokens. Structure follows IBM Carbon (UI shell, data table,
   tags, categorical palette) and Fluent 2 (overlay drawer). No external
   fonts or libraries, so the page works offline on a locked-down network.
   ===================================================================== */
:root {
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg:#f2f4f8; --layer:#ffffff; --layer-2:#f6f7f9; --layer-hover:#e8ebef; --selected:#e0e6ee;
  --border:#dde1e6; --border-strong:#a2a9b0; --text:#161616; --text-2:#525252; --text-3:#6f6f6f;
  --primary:#0f62fe; --primary-hover:#0050e6; --primary-weak:#edf5ff; --link:#0f62fe; --on-primary:#ffffff;
  --header:#161616; --header-text:#f4f4f4; --header-2:#c6c6c6; --header-hover:#2c2c2c; --header-border:#393939;
  --nav-bg:#ffffff; --scrim:rgba(22,22,22,.5);
  --bar:#0f62fe; --other:#a8a8a8; --grid:#e8e8e8; --up:#da1e28; --down:#198038;
  --run:#0f62fe; --grow:#8a3ffc; --transform:#007d79; --rgt-ink:#ffffff;
  --c1:#6929c4; --c2:#1192e8; --c3:#005d5d; --c4:#9f1853; --c5:#fa4d56; --c6:#570408; --c7:#198038; --c8:#002d9c;
  --urg-passed:#da1e28; --urg-30:#eb6200; --urg-60:#d2a106; --urg-90:#8d8d8d; --urg-later:#78a9ff;
  --tag-red-bg:#ffd7d9; --tag-red:#a2191f; --tag-orange-bg:#ffe2cc; --tag-orange:#8a3800;
  --tag-yellow-bg:#fcf4d6; --tag-yellow:#684e00; --tag-green-bg:#defbe6; --tag-green:#0e6027;
  --tag-blue-bg:#d0e2ff; --tag-blue:#0043ce; --tag-gray-bg:#e0e0e0; --tag-gray:#393939;
  --tag-purple-bg:#e8daff; --tag-purple:#6929c4;
  --shadow-drawer:-8px 0 24px rgba(0,0,0,.18); --radius:4px; color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#161616; --layer:#262626; --layer-2:#2e2e2e; --layer-hover:#333333; --selected:#393939;
  --border:#393939; --border-strong:#6f6f6f; --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#8d8d8d;
  --primary:#0f62fe; --primary-hover:#0353e9; --primary-weak:#0b2350; --link:#78a9ff;
  --header:#161616; --header-border:#393939; --nav-bg:#1e1e1e; --scrim:rgba(0,0,0,.6);
  --bar:#4589ff; --other:#6f6f6f; --grid:#333333; --up:#fa4d56; --down:#42be65;
  --run:#78a9ff; --grow:#be95ff; --transform:#3ddbd9; --rgt-ink:#161616;
  --c1:#8a3ffc; --c2:#33b1ff; --c3:#08bdba; --c4:#ff7eb6; --c5:#fa4d56; --c6:#d4bbff; --c7:#6fdc8c; --c8:#4589ff;
  --urg-later:#4589ff;
  --tag-red-bg:#a2191f; --tag-red:#ffd7d9; --tag-orange-bg:#8a3800; --tag-orange:#ffe2cc;
  --tag-yellow-bg:#684e00; --tag-yellow:#fcf4d6; --tag-green-bg:#0e6027; --tag-green:#defbe6;
  --tag-blue-bg:#0043ce; --tag-blue:#d0e2ff; --tag-gray-bg:#525252; --tag-gray:#f4f4f4;
  --tag-purple-bg:#6929c4; --tag-purple:#e8daff; --shadow-drawer:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#161616; --layer:#262626; --layer-2:#2e2e2e; --layer-hover:#333333; --selected:#393939;
  --border:#393939; --border-strong:#6f6f6f; --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#8d8d8d;
  --primary:#0f62fe; --primary-hover:#0353e9; --primary-weak:#0b2350; --link:#78a9ff;
  --header:#161616; --header-border:#393939; --nav-bg:#1e1e1e; --scrim:rgba(0,0,0,.6);
  --bar:#4589ff; --other:#6f6f6f; --grid:#333333; --up:#fa4d56; --down:#42be65;
  --run:#78a9ff; --grow:#be95ff; --transform:#3ddbd9; --rgt-ink:#161616;
  --c1:#8a3ffc; --c2:#33b1ff; --c3:#08bdba; --c4:#ff7eb6; --c5:#fa4d56; --c6:#d4bbff; --c7:#6fdc8c; --c8:#4589ff;
  --urg-later:#4589ff;
  --tag-red-bg:#a2191f; --tag-red:#ffd7d9; --tag-orange-bg:#8a3800; --tag-orange:#ffe2cc;
  --tag-yellow-bg:#684e00; --tag-yellow:#fcf4d6; --tag-green-bg:#0e6027; --tag-green:#defbe6;
  --tag-blue-bg:#0043ce; --tag-blue:#d0e2ff; --tag-gray-bg:#525252; --tag-gray:#f4f4f4;
  --tag-purple-bg:#6929c4; --tag-purple:#e8daff; --shadow-drawer:-8px 0 24px rgba(0,0,0,.5); color-scheme:dark; }

* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.43 var(--font); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
[hidden] { display:none !important; }
.icon { flex:none; vertical-align:middle; }

/* ---------- shell ---------- */
.shell { display:grid; grid-template-rows:48px minmax(0,1fr); grid-template-columns:256px minmax(0,1fr); height:100vh; }
body.nav-collapsed .shell { grid-template-columns:48px minmax(0,1fr); }
.topbar { grid-column:1 / -1; display:flex; align-items:center; background:var(--header); color:var(--header-text); border-bottom:1px solid var(--header-border); min-width:0; }
.tb-btn { height:48px; min-width:48px; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:none; border:0; color:var(--header-text); padding:0 14px; }
.tb-btn:hover { background:var(--header-hover); }
.tb-btn:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 16px 0 4px; font-weight:600; white-space:nowrap; min-width:0; overflow:hidden; }
.brand-mark { width:22px; height:22px; border-radius:3px; background:var(--primary); display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; flex:none; }
.brand small { font-weight:400; color:var(--header-2); }
.dataset { display:flex; align-items:center; gap:8px; min-width:0; padding:0 16px; border-left:1px solid var(--header-border); height:100%; color:var(--header-2); font-size:13px; }
.dataset span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tb-spacer { flex:1; }

.sidenav { grid-row:2; background:var(--nav-bg); border-right:1px solid var(--border); overflow-y:auto; overflow-x:hidden; padding:8px 0 16px; }
.nav-group { margin-top:12px; }
.nav-h { font-size:12px; color:var(--text-3); padding:6px 16px; letter-spacing:.32px; white-space:nowrap; }
.nav-a { position:relative; display:flex; align-items:center; gap:12px; height:36px; padding:0 16px; color:var(--text-2); text-decoration:none !important; white-space:nowrap; }
.nav-a:hover { background:var(--layer-hover); color:var(--text); }
.nav-a[aria-current="page"] { background:var(--selected); color:var(--text); font-weight:600; }
.nav-a[aria-current="page"]::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary); }
.nav-a.muted { color:var(--text-3); }
.nav-a.disabled { pointer-events:none; opacity:.45; }
.nav-a .nav-l { flex:1; overflow:hidden; text-overflow:ellipsis; }
.nav-badge { font-size:11px; font-weight:600; min-width:20px; height:18px; padding:0 6px; border-radius:9px; display:inline-grid; place-items:center; background:var(--tag-gray-bg); color:var(--tag-gray); }
.nav-badge.red { background:var(--urg-passed); color:#fff; }
body.nav-collapsed .nav-h, body.nav-collapsed .nav-l, body.nav-collapsed .nav-badge { display:none; }
body.nav-collapsed .nav-a { padding:0; justify-content:center; }
.nav-foot { border-top:1px solid var(--border); margin-top:16px; padding:12px 16px; font-size:12px; color:var(--text-3); display:flex; gap:6px; align-items:center; }
body.nav-collapsed .nav-foot { display:none; }
.nav-scrim { display:none; }

.main { grid-row:2; overflow:auto; min-width:0; }
.page { max-width:1480px; margin:0 auto; padding:16px 32px 48px; }

@media (max-width:1055px) {
  .shell, body.nav-collapsed .shell { grid-template-columns:minmax(0,1fr); }
  .sidenav { position:fixed; top:48px; bottom:0; left:0; width:256px; z-index:40; transform:translateX(-100%); transition:transform .18s ease; }
  body.nav-open .sidenav { transform:none; box-shadow:8px 0 24px rgba(0,0,0,.2); }
  body.nav-open .nav-scrim { display:block; position:fixed; inset:48px 0 0 0; background:var(--scrim); z-index:39; }
  body.nav-collapsed .nav-h, body.nav-collapsed .nav-l, body.nav-collapsed .nav-badge { display:revert; }
  body.nav-collapsed .nav-foot { display:flex; }
  body.nav-collapsed .nav-a { padding:0 16px; justify-content:flex-start; }
  .page { padding:12px 16px 40px; }
  .dataset { display:none; }
}
@media (max-width:560px) { .brand small, .tb-label { display:none; } }

/* ---------- page header ---------- */
.crumbs { font-size:12px; color:var(--text-3); display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0 6px; }
.crumbs a { color:var(--text-2); }
.page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
.page-t { font-size:24px; line-height:32px; font-weight:600; margin:0; }
.page-s { color:var(--text-2); margin:4px 0 0; max-width:900px; }
.page-a { display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- buttons, inputs, tags ---------- */
.btn { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 14px; border-radius:var(--radius); border:1px solid transparent; font-size:14px; white-space:nowrap; text-decoration:none !important; }
.btn.primary { background:var(--primary); color:var(--on-primary); }
.btn.primary:hover { background:var(--primary-hover); }
.btn.secondary { background:var(--layer); border-color:var(--border-strong); color:var(--text); }
.btn.secondary:hover { background:var(--layer-hover); }
.btn.ghost { background:none; color:var(--link); padding:0 10px; }
.btn.ghost:hover { background:var(--layer-hover); }
.btn.sm { height:26px; padding:0 10px; font-size:13px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.icon-btn { width:32px; height:32px; display:inline-grid; place-items:center; border:0; background:none; border-radius:var(--radius); color:var(--text-2); }
.icon-btn:hover:not(:disabled) { background:var(--layer-hover); color:var(--text); }
.icon-btn:disabled { opacity:.35; cursor:not-allowed; }
.select, .input { height:32px; border:1px solid var(--border); border-bottom-color:var(--border-strong); background:var(--layer-2); border-radius:2px; padding:0 8px; min-width:0; width:100%; color:var(--text); }
.select:hover, .input:hover { background:var(--layer-hover); }
.input-icon { position:relative; display:block; }
.input-icon .icon { position:absolute; left:8px; top:8px; color:var(--text-3); pointer-events:none; }
.input-icon .input { padding-left:30px; }
.tag { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:10px; font-size:12px; font-weight:500; white-space:nowrap; background:var(--tag-gray-bg); color:var(--tag-gray); }
.tag.red { background:var(--tag-red-bg); color:var(--tag-red); } .tag.orange { background:var(--tag-orange-bg); color:var(--tag-orange); }
.tag.yellow { background:var(--tag-yellow-bg); color:var(--tag-yellow); } .tag.green { background:var(--tag-green-bg); color:var(--tag-green); }
.tag.blue { background:var(--tag-blue-bg); color:var(--tag-blue); } .tag.purple { background:var(--tag-purple-bg); color:var(--tag-purple); }
.seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius); overflow:hidden; flex-wrap:wrap; }
.seg button { border:0; background:var(--layer); height:30px; padding:0 12px; font-size:13px; color:var(--text-2); border-right:1px solid var(--border); }
.seg button:last-child { border-right:0; }
.seg button:hover { background:var(--layer-hover); }
.seg button[aria-pressed="true"] { background:var(--primary-weak); color:var(--link); font-weight:600; box-shadow:inset 0 -2px 0 var(--primary); }
.seg .n { color:var(--text-3); font-weight:400; margin-left:6px; }
.tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto; }
.tabs button { background:none; border:0; height:40px; padding:0 16px; color:var(--text-2); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tabs button:hover { color:var(--text); background:var(--layer-hover); }
.tabs button[aria-selected="true"] { color:var(--text); font-weight:600; border-bottom-color:var(--primary); }
.swatch { display:inline-block; width:10px; height:10px; border-radius:2px; flex:none; }
.dot-sw { display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; }
.sw-label { display:inline-flex; gap:6px; align-items:center; }

/* ---------- filter bar (Fiori-style filter header) ---------- */
.filterbar { position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 0 12px; margin-bottom:16px; border-bottom:1px solid var(--border); }
.fb-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px 12px; align-items:end; }
.fb-field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.fb-l { font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fb-search { grid-column:span 2; }
.fb-actions { display:flex; gap:4px; align-items:center; }
.fb-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; font-size:12px; color:var(--text-3); }
.chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 4px 0 10px; border-radius:12px; background:var(--tag-blue-bg); color:var(--tag-blue); border:0; font-size:12px; }
.chip .x { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; }
.chip:hover .x { background:rgba(0,0,0,.12); }
@media (max-width:640px) { .fb-search { grid-column:1 / -1; } .filterbar { position:static; } }

/* ---------- cards, KPIs ---------- */
.grid { display:grid; gap:16px; margin-bottom:16px; }
.g2 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
.card { background:var(--layer); border:1px solid var(--border); border-radius:var(--radius); min-width:0; display:flex; flex-direction:column; }
.grid > .card, .grid > section { min-width:0; }
.card + .card { margin-top:16px; }
.grid > .card + .card { margin-top:0; }
.card-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 16px 0; }
.card-t { font-size:16px; line-height:22px; font-weight:600; margin:0; }
.card-s { font-size:12px; color:var(--text-3); margin:2px 0 0; }
.card-a { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.card-b { padding:12px 16px 16px; flex:1; min-width:0; }
.card-b.flush { padding:12px 0 0; }
.card-f { border-top:1px solid var(--border); padding:10px 16px; font-size:13px; display:flex; justify-content:flex-end; gap:8px; align-items:center; }
.link { display:inline-flex; align-items:center; gap:4px; }

.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:16px; }
.kpi { background:var(--layer); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 12px; position:relative; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
.kpi::before { content:""; position:absolute; left:0; top:0; right:0; height:3px; background:var(--kpi-accent, transparent); }
.kpi.alert { --kpi-accent:var(--urg-passed); }
.kpi-l { font-size:12px; color:var(--text-2); display:flex; justify-content:space-between; gap:6px; }
.kpi-v { font-size:28px; line-height:36px; font-weight:600; margin:4px 0 2px; overflow-wrap:anywhere; }
.kpi-m { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--text-3); min-height:20px; }
.kpi .spark { margin-top:auto; padding-top:8px; }
a.kpi { color:inherit; text-decoration:none; } a.kpi:hover { border-color:var(--border-strong); background:var(--layer-2); }

/* ---------- bars ---------- */
.hbars { display:grid; gap:2px; }
.hb { display:grid; grid-template-columns:minmax(90px, 30%) minmax(40px,1fr) 92px 42px; align-items:center; gap:10px; background:none; border:0; padding:4px 6px; border-radius:2px; text-align:left; width:100%; min-height:28px; }
button.hb:hover { background:var(--layer-hover); }
.hb.active { background:var(--primary-weak); box-shadow:inset 3px 0 0 var(--primary); }
.hb-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
button.hb-name { background:none; border:0; padding:0; text-align:left; color:var(--link); }
.hb-track { height:12px; background:var(--layer-2); overflow:hidden; display:flex; }
.hb-fill { display:block; height:100%; background:var(--bar); flex:none; }
.hb.static .hb-fill { background:var(--other); }
.hb-val { text-align:right; font-size:13px; }
.hb-pct { text-align:right; font-size:12px; color:var(--text-3); }
.stack { display:flex; height:12px; overflow:hidden; background:var(--layer-2); width:100%; }
.stack span { display:block; height:100%; min-width:0; }
.stack.tall { height:20px; }
.stack.mini { height:8px; width:96px; display:inline-flex; vertical-align:middle; }
.stack-seg:hover, .stack-seg:focus { filter:brightness(1.15); outline:none; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--text-2); margin-bottom:10px; align-items:center; }
.legend > span { display:inline-flex; align-items:center; gap:6px; }
.empty-mini { color:var(--text-3); font-size:13px; padding:12px 0; }
@media (max-width:640px) { .hb { grid-template-columns:minmax(80px, 38%) 1fr 84px; } .hb-pct { display:none; } }

/* ---------- charts ---------- */
.chart { width:100%; overflow-x:auto; }
.chart svg { display:block; width:100%; height:auto; min-width:560px; }
.chart.small svg { min-width:0; }
svg text { fill:var(--text-3); font-size:11px; font-family:var(--font); }
svg .gridline { stroke:var(--grid); }
svg .axis { stroke:var(--border-strong); }
svg .today { stroke:var(--text); stroke-dasharray:3 3; }
svg .today-label { fill:var(--text); font-weight:600; }
svg .bar-label { fill:var(--text-2); font-weight:600; }
svg .connector { stroke:var(--text-3); stroke-dasharray:2 2; }
svg .ref { stroke:var(--text-3); stroke-dasharray:4 3; }
svg .line { fill:none; stroke:var(--text); stroke-width:2; }
svg .line-pt { fill:var(--layer); stroke:var(--text); stroke-width:1.5; }
svg .dot { stroke:var(--layer); stroke-width:1.5; cursor:pointer; }
svg .dot:hover, svg .dot:focus { stroke:var(--text); outline:none; }
svg [tabindex]:focus { outline:none; stroke:var(--text); stroke-width:1.5; }
svg rect[tabindex] { cursor:pointer; }
svg .band { fill:var(--layer-2); }
.spark svg { width:100%; height:32px; display:block; }
.spark .area { fill:var(--primary-weak); } .spark .ln { fill:none; stroke:var(--primary); stroke-width:1.5; }

/* ---------- data table (Carbon-style) ---------- */
.dt-wrap { overflow:auto; max-height:var(--dt-max, none); border-top:1px solid var(--border); }
table.dt { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
.dt th { position:sticky; top:0; z-index:2; background:var(--layer-2); color:var(--text); font-weight:600; text-align:left; height:36px; padding:0 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
.dt td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
.dt.compact td { padding:6px 12px; }
.dt tbody tr:hover td { background:var(--layer-hover); }
.dt tr.clickable { cursor:pointer; }
.dt tr.clickable:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
.dt tr.hl td { background:var(--tag-yellow-bg); }
.dt tfoot td { position:sticky; bottom:0; background:var(--layer-2); font-weight:600; border-top:1px solid var(--border-strong); border-bottom:0; height:36px; padding:0 12px; white-space:nowrap; }
.dt .num { text-align:right; white-space:nowrap; }
.dt .strong { font-weight:600; }
.dt .muted, .muted { color:var(--text-3); }
.dt .wrap { min-width:180px; }
.dt .sort { background:none; border:0; padding:0; font-weight:600; display:inline-flex; gap:4px; align-items:center; color:inherit; }
.dt .sort::after { content:"⇅"; font-size:11px; color:var(--text-3); }
.dt .sort[aria-sort="ascending"]::after { content:"↑"; color:var(--text); }
.dt .sort[aria-sort="descending"]::after { content:"↓"; color:var(--text); }
.dt .empty-cell { text-align:center; color:var(--text-3); padding:24px; }
.heat { position:relative; display:block; }
.heat > i { position:absolute; inset:-3px -6px; background:var(--primary); border-radius:2px; pointer-events:none; }
.heat > span { position:relative; }
.table-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:0 16px 12px; font-size:13px; color:var(--text-2); }
.pager { display:flex; align-items:center; gap:8px; justify-content:flex-end; padding:8px 16px; border-top:1px solid var(--border); font-size:13px; color:var(--text-2); flex-wrap:wrap; }
.pager .select { width:auto; height:28px; }

/* ---------- renewals calendar ---------- */
.cal { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
.cal-m { border:1px solid var(--border); border-radius:var(--radius); background:var(--layer); display:flex; flex-direction:column; min-width:0; }
.cal-m.over { border-color:var(--urg-passed); box-shadow:inset 0 3px 0 var(--urg-passed); }
.cal-h { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border); background:var(--layer-2); }
.cal-v { font-size:20px; font-weight:600; padding:8px 12px 2px; }
.cal-list { list-style:none; margin:0; padding:4px 0 8px; }
.cal-list button { width:100%; display:flex; gap:8px; justify-content:space-between; align-items:center; border:0; background:none; padding:4px 12px; font-size:12px; text-align:left; }
.cal-list button:hover { background:var(--layer-hover); }
.cal-list .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.cal-more { font-size:12px; color:var(--text-3); padding:0 12px 10px; }
.cal-empty { color:var(--text-3); font-size:12px; padding:8px 12px 12px; }

/* ---------- drawer (Fluent 2 overlay drawer) ---------- */
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:60; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--layer); z-index:61; display:flex; flex-direction:column; box-shadow:var(--shadow-drawer); animation:slidein .18s ease; }
@keyframes slidein { from { transform:translateX(24px); opacity:.6; } to { transform:none; opacity:1; } }
.drawer-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 16px 12px 24px; border-bottom:1px solid var(--border); }
.drawer-t { margin:0; font-size:20px; line-height:28px; font-weight:600; }
.drawer-s { margin:2px 0 0; color:var(--text-2); font-size:13px; }
.drawer-b { flex:1; overflow-y:auto; padding:16px 24px 24px; }
.drawer-f { display:flex; gap:8px; justify-content:flex-end; padding:12px 24px; border-top:1px solid var(--border); background:var(--layer-2); flex-wrap:wrap; }
.d-sec { margin-top:20px; }
.d-sec h3 { font-size:14px; font-weight:600; margin:0 0 8px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:1px; background:var(--border); border:1px solid var(--border); }
.stat { background:var(--layer); padding:10px 12px; }
.stat-l { font-size:12px; color:var(--text-3); }
.stat-v { font-size:18px; font-weight:600; margin-top:2px; }
dl.kv { display:grid; grid-template-columns:minmax(120px, 40%) 1fr; margin:0; font-size:13px; }
dl.kv dt, dl.kv dd { padding:6px 0; border-bottom:1px solid var(--border); margin:0; }
dl.kv dt { color:var(--text-2); padding-right:12px; }
dl.kv dd { overflow-wrap:anywhere; }

/* ---------- key contracts ---------- */
.ct-cmp { display:grid; grid-template-columns:minmax(80px, 24%) minmax(40px, 1fr) 104px; gap:10px 12px; align-items:center; font-size:13px; }
.ct-cmp .hb-track { height:20px; }
.ct-cmp .hb-val { font-weight:600; }
.ct-gap { margin-top:10px; font-size:13px; color:var(--text-2); }
.ct-fx { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
.ct-fx .fb-field { width:220px; }
.ct-fx .helper { white-space:normal; }
.ct-notes { margin:0; padding-left:18px; font-size:13px; color:var(--text-2); }
.ct-notes li + li { margin-top:6px; }
.ct-bars .hb { grid-template-columns:minmax(110px, 42%) minmax(40px, 1fr) 92px 42px; }
@media (max-width:640px) { .ct-bars .hb { grid-template-columns:minmax(80px, 42%) 1fr 84px; } }
.sub-h { font-size:13px; font-weight:600; margin:16px 16px 8px; }

/* ---------- landing / empty states ---------- */
.landing { max-width:980px; margin:24px auto; }
.hero { background:var(--layer); border:1px dashed var(--border-strong); border-radius:var(--radius); padding:40px 32px; text-align:center; }
body.dragging .hero { border-color:var(--primary); background:var(--primary-weak); }
.hero-icon { width:56px; height:56px; border-radius:50%; background:var(--primary-weak); color:var(--primary); display:grid; place-items:center; margin:0 auto 16px; }
.hero .page-s { margin:8px auto 20px; }
.btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.privacy { color:var(--text-3); font-size:13px; margin:16px 0 0; display:inline-flex; gap:6px; align-items:center; }
.features { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:16px; margin-top:16px; }
.feature { background:var(--layer); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.feature .icon { color:var(--primary); }
.feature h3 { font-size:14px; margin:8px 0 4px; }
.feature p { margin:0; font-size:13px; color:var(--text-2); }
.feature .needs { margin-top:8px; font-size:12px; color:var(--text-3); }
.empty-state { text-align:center; padding:56px 24px; }
.empty-state .hero-icon { background:var(--layer-2); color:var(--text-3); }
.empty-state h2 { font-size:20px; margin:0 0 6px; font-weight:600; }
.empty-state p { color:var(--text-2); max-width:560px; margin:0 auto 16px; }
.notice { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-left:3px solid var(--primary); background:var(--primary-weak); font-size:13px; margin-bottom:16px; }
.notice.warn { border-left-color:var(--urg-60); background:var(--tag-yellow-bg); color:var(--tag-yellow); }

/* ---------- data source form ---------- */
.form-grid { display:grid; grid-template-columns:minmax(140px, 34%) minmax(0,1fr); gap:10px 16px; align-items:start; }
.form-grid > label { font-size:13px; padding-top:6px; }
.form-grid .req::after { content:" *"; color:var(--urg-passed); }
.helper { font-size:12px; color:var(--text-3); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.map-cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap:10px 32px; }
.action-bar { position:sticky; bottom:0; display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; background:var(--layer); border:1px solid var(--border); border-radius:var(--radius); margin-top:16px; z-index:5; }
.ring text { font-size:22px; font-weight:600; fill:var(--text); }

/* ---------- misc ---------- */
.tooltip { position:fixed; z-index:80; pointer-events:none; background:var(--text); color:var(--bg); padding:8px 10px; border-radius:2px; font-size:12px; max-width:320px; line-height:1.45; box-shadow:0 2px 6px rgba(0,0,0,.2); }
.tooltip b { display:block; font-size:13px; }
.toast { position:fixed; right:16px; bottom:16px; z-index:90; background:var(--text); color:var(--bg); padding:12px 16px; border-left:3px solid var(--down); border-radius:2px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.25); max-width:420px; }
body.dragging::after { content:"Drop CSV files to load"; position:fixed; inset:0; display:grid; place-items:center; font-size:22px; font-weight:600; color:var(--text); background:color-mix(in srgb, var(--bg) 82%, transparent); border:3px dashed var(--primary); z-index:100; pointer-events:none; }

    const info = { name:p.name, rows:p.rows.length, cols:p.headers.length, delim:{ ',':'Comma', ';':'Semicolon', '\t':'Tab', '|':'Pipe' }[p.delimiter],
      encoding:p.encoding || '—', skipped:p.skipped, subtotals:p.subtotals || 0, filledDown:p.filledDown || 0, grand:p.grand, start:offset, end:offset + p.rows.length };
    offset += p.rows.length;
    return info;
  });
  const saved = store.get('map:' + sig()), guess = guessMapping(S.prof);
  S.map = saved ? saved.map : guess.map; S.months = saved ? saved.months : guess.months;
  const yr = S.map.amount != null ? yearOf(headers[S.map.amount]) : null;
  S.opts = { label:preset.label || (yr ? `FY${yr}` : ''), currency:guessCurrency(S.prof, rows, S.map.amount), asOf:dayToISO(todayDay()), fyStart:0, dateOrder:'auto', dec:'auto',
    ...(saved ? Object.fromEntries(Object.entries(saved.opts || {}).filter(([, x]) => x !== undefined)) : {}) };
  S.loaded = true;
  apply();
  const rec = reconcile();
  toast(`Loaded ${fmtInt(rows.length)} rows from ${S.files.join(', ')}.` + (rec.some((x) => x.status === 'ok') && rec.every((x) => x.status !== 'off') ? ` Lines add up to the file's grand total.` : rec.some((x) => x.status === 'off') ? ` Warning: lines don't add up to the file's grand total; see Data source.` : ''));
  go(S.map.amount == null ? 'source' : defaultPage());
}
// Decode bytes: UTF-8 when valid, otherwise whichever legacy encoding (Windows-1252 or Mac Roman,
// as written by Excel on Windows / Mac) produces more common accented letters and punctuation.
function decodeBytes(buf) {
  const utf8 = new TextDecoder('utf-8').decode(buf);
  if (!utf8.includes('\ufffd')) return { text:utf8, encoding:'UTF-8' };
  const COMMON = /[\u00c0-\u00cf\u00d1-\u00d6\u00d8-\u00dd\u00df-\u00ef\u00f1-\u00f6\u00f8-\u00fd\u00ff\u0152\u0153\u20ac\u00a3\u2013\u2014\u2018\u2019\u201c\u201d\u2026\u2022\u00b0]/g;
  const tries = [['windows-1252', 'Windows-1252'], ['macintosh', 'Mac Roman']].map(([enc, lbl]) => {
    try { const text = new TextDecoder(enc).decode(buf); return { text, encoding:lbl, score:(text.match(COMMON) || []).length }; } catch (e) { return null; }
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  return tries[0] || { text:utf8, encoding:'UTF-8 (with errors)' };
}
async function readFiles(fileList) {
  const files = [...fileList].filter((f) => /\.(csv|txt|tsv)$/i.test(f.name) || f.type === 'text/csv');
  if (!files.length) { toast('Please choose .csv files. For Excel, use File → Save As → CSV UTF-8 first.'); return; }
  const parsed = [];
  for (const f of files) {
    const { text, encoding } = decodeBytes(await f.arrayBuffer());
    parsed.push({ name:f.name, encoding, ...parseCSV(text) });
  }
  load(parsed);
}
// Compare each file's line items with the "Grand Total" row the file itself carried (pivot exports).
function reconcile() {
  if (S.map.amount == null) return [];
  const hdr0 = S.headers[S.map.amount], dec = S.opts.dec === 'auto' ? S.prof[S.map.amount].dec : S.opts.dec;
  return S.fileInfo.map((f) => {
    const lines = sum(S.recs.slice(f.start, f.end), (r) => r.amount);
    const g = f.grand && f.grand[hdr0] != null ? parseNum(f.grand[hdr0], dec) : null;
    if (g == null || !isFinite(g)) return { ...f, lines, grandValue:null, status:'none' };
    const diff = lines - g;
    return { ...f, lines, grandValue:g, diff, status:Math.abs(diff) <= Math.max(1, Math.abs(g) * 0.0005) ? 'ok' : 'off' };
  });
}
// Embedded data: <script type="text/plain" id="sample-csv" data-name=… data-label=… data-button=… data-autoload="true">
function loadSample() {

function openPicker() { $('file-input').click(); }
function downloadCsv(header, rows, name) {
  const esc = (x) => { x = x == null ? '' : String(x); return /[",\n;]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const out = [header.map(esc).join(',')].concat(rows.map((r) => r.map(esc).join(',')));
  const a = h('a', { href:URL.createObjectURL(new Blob(['\ufeff' + out.join('\r\n')], { type:'text/csv;charset=utf-8' })), download:name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`Exported ${fmtInt(rows.length)} rows.`);
}
function exportCsv(recs) { downloadCsv(S.headers, recs.map((r) => r.row), 'budget-filtered.csv'); }
function exportContract(c) {
  const d = contractData(c), r2 = (x) => (x == null ? '' : x.toFixed(2));
  const header = ['Contract', 'Invoice', 'Product', 'Kind', 'Quantity', 'Unit', 'Service from', 'Service to', 'Months billed', `Invoiced (${d.ic})`, 'Annual factor', `Annual (${d.ic})`, `Per unit per month (${d.ic})`]
    .concat(d.needFx ? [`Annual (${d.bc}, at ${d.rate ?? 'no rate'})`] : []);
  downloadCsv(header, d.lines.map((l) => [c.name, l.inv.ref, l.product, l.kind, l.qty ?? '', l.unit || '', l.from || '', l.to || '', l.months == null ? '' : +l.months.toFixed(2), r2(l.amount),
    l.factor == null ? '' : +l.factor.toFixed(4), r2(l.annual), r2(l.perUnitMonth)].concat(d.needFx ? [d.rate != null && l.annual != null ? r2(l.annual * d.rate) : ''] : [])), `contract-${c.id}-annualised.csv`);
}
